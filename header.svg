<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Naveen Asundi, Software Developer, Full-Stack and AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#7c8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#dots)"/>
  <circle cx="1000" cy="120" r="260" fill="url(#glow)"/>
  <text x="1010" y="190" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="150" font-weight="700" fill="#5cc8ff" fill-opacity="0.10">&lt;/&gt;</text>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#bar)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="13.5" fill="none" stroke="#232938"/>

  <text x="70" y="78" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#5cc8ff">SOFTWARE DEVELOPER  ·  FULL-STACK  ·  AI</text>
  <text x="70" y="146" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5" fill="#e9ecf2">Naveen Asundi</text>
  <text x="70" y="186" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#9aa4b5">Building practical full-stack and AI-enabled applications.</text>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#cfd5e0" text-anchor="middle">
    <rect x="70"  y="212" width="262" height="32" rx="16" fill="#161b26" stroke="#2a3142"/>
    <text x="201" y="233">BCA · Artificial Intelligence</text>
    <rect x="344" y="212" width="130" height="32" rx="16" fill="#161b26" stroke="#2a3142"/>
    <text x="409" y="233">Class of 2028</text>
    <rect x="486" y="212" width="172" height="32" rx="16" fill="#161b26" stroke="#2a3142"/>
    <text x="572" y="233">Internship · 2027</text>
